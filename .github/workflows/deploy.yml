name: Scrape and deploy

on:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run scrape

      - name: Commit schedule changes
        run: |
          if git diff --quiet -I '"generatedAt"' -- src/data/schedule.json; then
            echo "No schedule changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/data/schedule.json
            git commit -m "Update schedule data"
            git push
          fi

      - name: Keep scheduled workflow enabled
        if: github.event_name == 'schedule'
        run: gh workflow enable deploy.yml
        env:
          GH_TOKEN: ${{ github.token }}

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
